<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Inscription</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>

        <header class="site-header">
        <!-- Start Navigation Bar -->
         <div class="navbar">
            <div class="brand">
                <h2>[YouCode]</h2>
            </div>
            <ul class="links">
                <li>Accueil</li>
                <li>Campus</li>
                <li>Clubs & activites</li>
                <li>Evenements</li>
                <li>Conseils aux nouveaux</li>
                <li>Contact</li>
                <li>
                    <input class="search" type="text" placeholder="Rechercher..." />
                </li>
                <li>
                    <button class="btn">Rejoindre<br />
                        l'aventure</button>
                </li>
            </ul>
         </div>
        </header>

        <main>

            <section class="first-day">
                <div class="introduction">
                    <p class="lead">TES PREMIER PAS A YOUCODE</p>
                    <h1 class="h1">Ton aventure commence par une rencontre</h1>
                    <form>
                        <div class="form-group">
                            <label for="nom">
                                Nom
                            </label>
                            <input
                                type="text"
                                id="nom"
                                name="nom"
                                autoComplete="name"
                                required
                            > 
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </body>

</html>
